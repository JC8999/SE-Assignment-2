{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!-- CSS Stylesheet -->
        <link rel="stylesheet" href="{% static 'stylesheet.css' %}"/>

        <!-- Fonts -->
        <link rel ="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome Icons -->
        <script src="https://kit.fontawesome.com/f382cfac43.js" crossorigin="anonymous"></script>

        <title>{% block title %}{% endblock %}
        </title>
    </head>
    <body>
        <div class="container-fluid">
        <div class="row">

    <!-- Desktop sidebar -->
    <div class="d-none d-lg-flex p-0">
        <div class="d-flex flex-column sidebar-desktop bg-light border-end p-3" style="width: 250px;">

            <div class="text-center mb-3">
                <div class="fw-bold fs-4">The Tabletop Club</div>
            </div>

            <hr>

            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a class="nav-link link-dark" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="/members">Members</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="/game_catalogue">Game Catalogue</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="/rentals">Rentals</a>
                </li>
            </ul>

            <hr>
            <div class="text-muted small">Logout</div>
        </div>
    </div>

    <!-- Mobile offcanvas sidebar -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel" style="max-width: 250px;">
            <div class="d-flex flex-column h-100">
                <div class="offcanvas-header">
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>

                <hr>

                <div class="offcanvas-body pt-0 d-flex flex-column">
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a class="nav-link link-dark" href="/">
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-dark" href="/members">Members</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-dark" href="/game_catalogue">Game Catalogue</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-dark" href="/rentals">Rentals</a>
                        </li>
                    </ul>

                    <hr class="mt-auto">
                    <div class="text-muted small">Logout</div>
                </div>
            </div>
        </div>

    <!-- Mobile toggle navbar -->
    <nav class="navbar bg-light border-bottom d-lg-none">
        <div class="container-fluid">
            <button class="btn btn-outline-secondary" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas"
                    aria-controls="sidebarOffcanvas" aria-label="Open menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Main content -->
    <div class="main_body col p-4">
        <div class="container-fluid">
            <header class="mb-3 text-center">
                <h1 class="display-6"><strong>{% block header %}{% endblock %}</strong></h1>
            </header>
            <main>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
