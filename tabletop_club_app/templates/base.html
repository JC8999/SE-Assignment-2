{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!-- CSS Stylesheet -->
        <link rel="stylesheet" href="{% static 'stylesheet.css' %}"/>

        <!-- Fonts -->
        <link rel ="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome Icons -->
        <script src="https://kit.fontawesome.com/f382cfac43.js" crossorigin="anonymous"></script>

        <title>{% block title %}{% endblock %}</title>
    </head>
    <body>

        <!-- Mobile offcanvas sidebar -->
        <div class="offcanvas offcanvas-start sidebar-mobile" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel">
            <div class="d-flex flex-column h-100">

                <div class="offcanvas-header mobile-sidebar-header">
                    <div class="sidebar-title">The Tabletop Club</div>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>

                <div class="offcanvas-body pt-0 d-flex flex-column">
                    <ul class="sidebar-nav">
                        <li>
                            <a class="sidebar-link" href="/">
                                <i class="fa-solid fa-house"></i>
                                <span>Home</span>
                            </a>
                        </li>
                        <li>
                            <a class="sidebar-link" href="/members">
                                <i class="fa-solid fa-users"></i>
                                <span>Members</span>
                            </a>
                        </li>
                        <li>
                            <a class="sidebar-link" href="/game_catalogue">
                                <i class="fa-solid fa-dice"></i>
                                <span>Game Catalogue</span>
                            </a>
                        </li>
                        <li>
                            <a class="sidebar-link" href="/rentals">
                                <i class="fa-solid fa-box"></i>
                                <span>Rentals</span>
                            </a>
                        </li>
                    </ul>

                    <hr>

                    <div class="sidebar-footer">
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="sidebar-link logout-link logout-button">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span>Logout</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile toggle navbar -->
        <nav class="navbar mobile-topbar d-lg-none">
            <div class="container-fluid">
                <button class="btn mobile-menu-btn" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas"
                    aria-controls="sidebarOffcanvas" aria-label="Open menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </nav>

        <div class="container-fluid">
            <div class="row">

                <!-- Desktop sidebar -->
                <div class="d-none d-lg-flex p-0">
                    <div class="sidebar-desktop">

                        <div class="sidebar-header">
                            <div class="sidebar-title">The Tabletop Club</div>
                        </div>

                        <hr>

                        <ul class="sidebar-nav">
                            <li>
                                <a class="sidebar-link" href="/">
                                    <i class="fa-solid fa-house"></i>
                                    <span>Home</span>
                                </a>
                            </li>
                            <li>
                                <a class="sidebar-link" href="/members">
                                    <i class="fa-solid fa-users"></i>
                                    <span>Members</span>
                                </a>
                            </li>
                            <li>
                                <a class="sidebar-link" href="/game_catalogue">
                                    <i class="fa-solid fa-dice"></i>
                                    <span>Game Catalogue</span>
                                </a>
                            </li>
                            <li>
                                <a class="sidebar-link" href="/rentals">
                                    <i class="fa-solid fa-box"></i>
                                    <span>Rentals</span>
                                </a>
                            </li>
                        </ul>

                        <hr>

                        <div class="sidebar-footer">
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="sidebar-link logout-link logout-button">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span>Logout</span>
                            </button>
                        </form>
                    </div>
                    </div>
                </div>

                <!-- Main content -->
                <div class="main_body col p-4">
                    <div class="container-fluid">
                        <header class="mb-3 text-center">
                            <h1 class="display-6"><strong>{% block header %}{% endblock %}</strong></h1>
                        </header>
                        <main>
                            {% block content %}{% endblock %}
                        </main>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
