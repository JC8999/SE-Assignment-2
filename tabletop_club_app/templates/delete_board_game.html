{% extends "base.html" %}

{% block title %}Delete Board Game{% endblock %}

{% block content %}
<p>Are you sure you want to delete <strong>{{ game.title }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-secondary">Delete</button>
    <a href="{% url 'game_catalogue' %}" class="btn-primary">Cancel</a>
</form>
{% endblock %}
