{% extends "base.html" %}

{% block title %}Delete Member{% endblock %}

{% block content %}
<p>Are you sure you want to delete <strong>{{ member.username }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-secondary">Delete</button>
    <a href="{% url 'members' %}" class="btn-primary">Cancel</a>
</form>
{% endblock %}
